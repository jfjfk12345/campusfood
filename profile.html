<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusFood – Личный кабинет</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a class="logo" href="index.html">🍽️ CampusFood</a>
    <div class="nav-links">
      <a href="index.html">Меню</a>
      <a href="cart.html">Корзина</a>
      <a href="profile.html" class="active">Личный кабинет</a>
      <a href="admin.html" id="adminLink" class="hidden">Админ</a>
    </div>
    <div class="nav-user" id="navUser">
      <span id="navUserName" style="font-weight:600;font-size:.9rem;"></span>
      <button class="btn btn-sm btn-secondary" id="logoutBtn">Выйти</button>
    </div>
  </div>
</nav>

<div class="profile-section">
  <!-- Profile header -->
  <div class="profile-header">
    <div class="avatar" id="avatarBlock">?</div>
    <div>
      <h2 id="profileName">Загрузка...</h2>
      <p id="profileEmail" style="color:var(--text-muted);"></p>
      <span id="profileRole" class="badge mt-1">user</span>
    </div>
    <button class="btn btn-outline btn-sm" style="margin-left:auto" onclick="openEditModal()">✏️ Редактировать</button>
  </div>

  <!-- Tabs -->
  <div style="display:flex;gap:1rem;margin-bottom:1.5rem;border-bottom:2px solid var(--border);">
    <button class="btn btn-sm" id="tab-active"    onclick="switchTab('active')"  style="border-radius:8px 8px 0 0;border-bottom:3px solid var(--primary);color:var(--primary);">🕐 Текущие</button>
    <button class="btn btn-sm" id="tab-history"   onclick="switchTab('history')" style="border-radius:8px 8px 0 0;">📋 История</button>
  </div>

  <!-- Active orders (real-time) -->
  <div id="activeOrders">
    <div class="spinner"></div>
  </div>

  <!-- History orders -->
  <div id="historyOrders" class="hidden">
    <div class="spinner"></div>
  </div>
</div>

<!-- Edit Profile Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('editModal').classList.remove('open')">✕</button>
    <h2>Редактировать профиль</h2>
    <div class="form-group"><label>Имя</label><input type="text" id="editName"/></div>
    <button class="btn btn-primary" style="width:100%" onclick="saveProfile()">Сохранить</button>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
  import { auth, db } from './js/firebase-config.js';
  import { onAuthChange, getCurrentUserProfile } from './js/auth.js';
  import { subscribeMyOrders } from './js/orders.js';
  import { signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import { doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  let allOrders = [];
  let unsubOrders = null;

  onAuthChange(async user => {
    if (!user) { location.href = 'auth.html'; return; }
    const p = await getCurrentUserProfile();
    document.getElementById('navUserName').textContent = p?.displayName || user.email;
    document.getElementById('profileName').textContent  = p?.displayName || 'Пользователь';
    document.getElementById('profileEmail').textContent = user.email;
    document.getElementById('profileRole').textContent  = p?.role || 'user';
    document.getElementById('avatarBlock').textContent  = (p?.displayName || user.email)[0].toUpperCase();
    document.getElementById('editName').value = p?.displayName || '';
    if (p?.role === 'admin') document.getElementById('adminLink').classList.remove('hidden');
    document.getElementById('logoutBtn').onclick = () => signOut(auth);

    // Real-time orders subscription
    unsubOrders = subscribeMyOrders(orders => {
      allOrders = orders;
      renderOrders();
    });
  });

  function renderOrders() {
    const active  = allOrders.filter(o => ['pending','preparing','ready'].includes(o.status));
    const history = allOrders.filter(o => ['completed','cancelled'].includes(o.status));

    document.getElementById('activeOrders').innerHTML = active.length
      ? active.map(orderCard).join('')
      : '<div class="empty-state"><div class="icon">✅</div><p>Нет активных заказов</p><a href="index.html" class="btn btn-primary mt-2">Сделать заказ</a></div>';

    document.getElementById('historyOrders').innerHTML = history.length
      ? history.map(orderCard).join('')
      : '<div class="empty-state"><div class="icon">📋</div><p>История заказов пуста</p></div>';
  }

  function orderCard(o) {
    const statusMap = { pending:'Ожидает', preparing:'Готовится', ready:'Готово! 🎉', completed:'Выполнен', cancelled:'Отменён' };
    const d = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString('ru-RU') : '';
    return `
      <div class="order-card">
        <div class="order-header">
          <div>
            <div style="font-weight:700;">Заказ #${o.id.slice(-6).toUpperCase()}</div>
            <div class="order-id">${d}</div>
            ${o.pickupTime ? `<div class="order-id">⏰ Получение: ${o.pickupTime}</div>` : ''}
          </div>
          <span class="order-status status-${o.status}">${statusMap[o.status] || o.status}</span>
        </div>
        <div class="order-items">${(o.items||[]).map(i => `${i.name} × ${i.qty}`).join(', ')}</div>
        <div class="order-total">Итого: ${o.total} ₽</div>
      </div>`;
  }

  window.switchTab = (tab) => {
    document.getElementById('activeOrders').classList.toggle('hidden', tab !== 'active');
    document.getElementById('historyOrders').classList.toggle('hidden', tab !== 'history');
    document.getElementById('tab-active').style.borderBottom  = tab === 'active'  ? '3px solid var(--primary)' : 'none';
    document.getElementById('tab-history').style.borderBottom = tab === 'history' ? '3px solid var(--primary)' : 'none';
    document.getElementById('tab-active').style.color  = tab === 'active'  ? 'var(--primary)' : '';
    document.getElementById('tab-history').style.color = tab === 'history' ? 'var(--primary)' : '';
  };

  window.openEditModal = () => document.getElementById('editModal').classList.add('open');

  window.saveProfile = async () => {
    const name = document.getElementById('editName').value.trim();
    if (!name) return;
    const uid = auth.currentUser.uid;
    await updateDoc(doc(db, 'users', uid), { displayName: name });
    document.getElementById('profileName').textContent = name;
    document.getElementById('navUserName').textContent = name;
    document.getElementById('avatarBlock').textContent = name[0].toUpperCase();
    document.getElementById('editModal').classList.remove('open');
    toast('Профиль обновлён ✅', 'success');
  };

  function toast(msg, type='') {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast ${type}`; t.textContent = msg; c.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }
</script>
</body>
</html>
