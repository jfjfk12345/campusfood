<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusFood – Столовая колледжа</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>"/>
</head>
<body>

<!-- ===== НАВИГАЦИЯ ===== -->
<nav class="navbar">
  <div class="navbar-inner">
    <a class="logo" href="index.html">🍽️ CampusFood</a>
    <div class="nav-links">
      <a href="index.html" class="active">Меню</a>
      <a href="cart.html">Корзина <span id="cartBadge" class="badge-count hidden">0</span></a>
      <a href="profile.html">Личный кабинет</a>
      <a href="admin.html" id="adminLink" class="hidden">Админ</a>
    </div>
    <div class="nav-auth auth-pending" id="navAuth">
      <button class="btn btn-outline btn-sm" onclick="openLoginModal()">Войти</button>
      <button class="btn btn-primary btn-sm" onclick="openRegModal()">Регистрация</button>
    </div>
    <div class="nav-user hidden" id="navUser">
      <span id="navUserName" style="font-weight:600; font-size:.9rem;"></span>
      <button class="btn btn-sm btn-secondary" onclick="handleLogout()">Выйти</button>
    </div>
  </div>
</nav>

<!-- ===== ГЛАВНЫЙ БАННЕР ===== -->
<section class="hero">
  <div class="hero-content">
    <h1>Закажи еду<br/><span>заранее</span> — без очереди</h1>
    <p>Онлайн-заказ в столовой колледжа. Выбери блюда, укажи время — и просто забери.</p>
    <div class="hero-actions">
      <button class="btn btn-primary" onclick="document.getElementById('menuSection').scrollIntoView({behavior:'smooth'})">Смотреть меню</button>
      <a href="cart.html" class="btn btn-outline" style="color:#fff; border-color:#fff;">Моя корзина</a>
    </div>
  </div>
</section>

<!-- ===== ПАНЕЛЬ ИНСТРУМЕНТОВ ===== -->
<div class="toolbar">
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Поиск блюд..." oninput="handleSearch(this.value)"/>
  </div>
  <div class="filter-group" id="filterChips">
    <button class="filter-chip active" data-cat="all" onclick="filterCat(this,'all')">Все</button>
    <button class="filter-chip" data-cat="main"    onclick="filterCat(this,'main')">Первое/Второе</button>
    <button class="filter-chip" data-cat="salad"   onclick="filterCat(this,'salad')">Салаты</button>
    <button class="filter-chip" data-cat="soup"    onclick="filterCat(this,'soup')">Супы</button>
    <button class="filter-chip" data-cat="drink"   onclick="filterCat(this,'drink')">Напитки</button>
    <button class="filter-chip" data-cat="dessert" onclick="filterCat(this,'dessert')">Десерты</button>
    <button class="filter-chip" data-cat="bread"   onclick="filterCat(this,'bread')">Выпечка</button>
  </div>
  <select class="sort-select" id="sortSelect" onchange="handleSort(this.value)">
    <option value="nameLower">По названию</option>
    <option value="price">По цене (↑)</option>
    <option value="createdAt">Новинки</option>
  </select>
</div>

<!-- ===== СЕТКА МЕНЮ ===== -->
<section class="menu-section" id="menuSection">
  <h2 class="section-title">🍽️ Меню дня</h2>
  <div class="menu-grid" id="menuGrid" aria-busy="true" aria-label="Загрузка меню">
    <div class="menu-skeleton-card" aria-hidden="true"><div class="menu-skeleton-image"></div><div class="menu-skeleton-body"><div class="menu-skeleton-line"></div><div class="menu-skeleton-line"></div><div class="menu-skeleton-line is-price"></div></div></div>
    <div class="menu-skeleton-card" aria-hidden="true"><div class="menu-skeleton-image"></div><div class="menu-skeleton-body"><div class="menu-skeleton-line"></div><div class="menu-skeleton-line"></div><div class="menu-skeleton-line is-price"></div></div></div>
    <div class="menu-skeleton-card" aria-hidden="true"><div class="menu-skeleton-image"></div><div class="menu-skeleton-body"><div class="menu-skeleton-line"></div><div class="menu-skeleton-line"></div><div class="menu-skeleton-line is-price"></div></div></div>
    <div class="menu-skeleton-card" aria-hidden="true"><div class="menu-skeleton-image"></div><div class="menu-skeleton-body"><div class="menu-skeleton-line"></div><div class="menu-skeleton-line"></div><div class="menu-skeleton-line is-price"></div></div></div>
    <div class="menu-skeleton-card" aria-hidden="true"><div class="menu-skeleton-image"></div><div class="menu-skeleton-body"><div class="menu-skeleton-line"></div><div class="menu-skeleton-line"></div><div class="menu-skeleton-line is-price"></div></div></div>
    <div class="menu-skeleton-card" aria-hidden="true"><div class="menu-skeleton-image"></div><div class="menu-skeleton-body"><div class="menu-skeleton-line"></div><div class="menu-skeleton-line"></div><div class="menu-skeleton-line is-price"></div></div></div>
  </div>
  <div class="load-more-wrap">
    <button id="loadMoreBtn" class="btn btn-outline hidden" onclick="handleLoadMore()">Показать ещё</button>
  </div>
</section>

<!-- ===== КОНТЕЙНЕР УВЕДОМЛЕНИЙ ===== -->
<div class="toast-container" id="toastContainer"></div>

<!-- ===== ОКНО ВХОДА ===== -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('loginModal')">✕</button>
    <h2>Вход</h2>
    <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="example@mail.com"/></div>
    <div class="form-group"><label>Пароль</label><input type="password" id="loginPassword" placeholder="••••••"/></div>
    <button class="btn btn-primary" style="width:100%" onclick="handleLogin()">Войти</button>
    <p class="auth-switch mt-2"><a onclick="switchToReset()">Забыли пароль?</a></p>
    <p class="auth-switch"><a onclick="closeModal('loginModal'); openRegModal()">Нет аккаунта? Зарегистрироваться</a></p>
  </div>
</div>

<!-- ===== ОКНО РЕГИСТРАЦИИ ===== -->
<div class="modal-overlay" id="regModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('regModal')">✕</button>
    <h2>Регистрация</h2>
    <div class="form-group"><label>Имя</label><input type="text" id="regName" placeholder="Ваше имя"/></div>
    <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="example@mail.com"/></div>
    <div class="form-group"><label>Пароль</label><input type="password" id="regPassword" placeholder="Минимум 6 символов"/></div>
    <button class="btn btn-primary" style="width:100%" onclick="handleRegister()">Зарегистрироваться</button>
    <p class="auth-switch mt-2"><a onclick="closeModal('regModal'); openLoginModal()">Уже есть аккаунт? Войти</a></p>
  </div>
</div>

<!-- ===== ОКНО СБРОСА ПАРОЛЯ ===== -->
<div class="modal-overlay" id="resetModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('resetModal')">✕</button>
    <h2>Сброс пароля</h2>
    <div class="form-group"><label>Email</label><input type="email" id="resetEmail" placeholder="example@mail.com"/></div>
    <button class="btn btn-primary" style="width:100%" onclick="handleReset()">Отправить ссылку</button>
  </div>
</div>

<script type="module" src="js/menu.js"></script>
</body>
</html>
